name: selftest

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m py_compile skills/second-brain/scripts/brain skills/second-brain/scripts/lib/*.py
      - name: Self-test
        run: bash tests/selftest.sh
      - name: Install test
        run: bash tests/install-test.sh
        env:
          BRAIN_KIT_ONLINE_TEST: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Version check
        run: bash tests/version-check.sh

  # BusyBox sh, tar and coreutils, as on Alpine. The installer refuses root,
  # so the tests run as nobody.
  busybox:
    runs-on: ubuntu-latest
    container: alpine:3.20
    steps:
      - run: apk add --no-cache bash python3
      - uses: actions/checkout@v4
      - name: Install test and self-test
        run: |
          chown -R nobody .
          su nobody -s /bin/sh -c 'bash tests/install-test.sh && bash tests/selftest.sh'

  # Windows: the PowerShell installer under PowerShell 7 and Windows
  # PowerShell 5.1, and the CLI self-test under Git Bash.
  windows:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test (PowerShell 7)
        shell: pwsh
        run: ./tests/install-test.ps1
        env:
          BRAIN_KIT_ONLINE_TEST: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install test (Windows PowerShell 5.1)
        if: success() || failure()
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/install-test.ps1; exit $LASTEXITCODE
        env:
          BRAIN_KIT_ONLINE_TEST: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Self-test (Git Bash)
        if: success() || failure()
        shell: bash
        run: |
          # setup-python provides python.exe only; selftest runs the CLI via its python3 shebang
          command -v python3 >/dev/null || cp "$(command -v python)" "$(dirname "$(command -v python)")/python3.exe"
          bash tests/selftest.sh
